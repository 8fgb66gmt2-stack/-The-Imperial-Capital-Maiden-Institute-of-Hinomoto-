<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">薔薇の庭園と帝都女學院の校舎</title>
<desc id="desc">象牙色の石造りの校舎、アーチ窓、庭園の薔薇と樹木を淡い水彩調で描いた装飾画。</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5ead9"/><stop offset=".58" stop-color="#eadbd4"/><stop offset="1" stop-color="#d9d8c8"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff9e9"/><stop offset=".52" stop-color="#e9ddc8"/><stop offset="1" stop-color="#cbb99e"/></linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a97b75"/><stop offset="1" stop-color="#805d60"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7e1d5"/><stop offset=".5" stop-color="#e9d6c5"/><stop offset="1" stop-color="#b7c8bd"/></linearGradient>
  <linearGradient id="garden" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a5ad8b"/><stop offset="1" stop-color="#75866e"/></linearGradient>
  <radialGradient id="sunlight"><stop stop-color="#fff9e8" stop-opacity=".95"/><stop offset="1" stop-color="#fff9e8" stop-opacity="0"/></radialGradient>
  <pattern id="papergrain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".8" fill="#8b765e" opacity=".12"/><circle cx="16" cy="14" r=".7" fill="#8b765e" opacity=".1"/></pattern>
</defs>
